<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatCard - Series Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            background: #0f0f1a;
            background-image: 
                radial-gradient(ellipse at 30% 20%, rgba(212, 168, 75, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(100, 100, 120, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            gap: 40px;
            overflow-x: hidden;
        }

        .page-title {
            font-family: 'Oswald', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(212, 168, 75, 0.3);
        }

        .main-container {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            max-width: 1000px;
            width: 100%;
        }

        /* Card Section */
        .card-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .tier-label {
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            padding: 6px 16px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* FIFA Card */
        .fifa-card {
            position: relative;
            width: 300px;
            height: 430px;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .fifa-card.no-hover {
            pointer-events: none;
        }

        .fifa-card:not(.no-hover):hover {
            transform: scale(1.03) translateY(-8px);
            filter: brightness(1.08);
        }

        /* Card Background */
        .card-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.6));
        }

        /* Diagonal Pattern */
        .card-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: url(#cardClip);
            overflow: hidden;
            pointer-events: none;
        }

        .card-pattern::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                55deg,
                transparent,
                transparent 6px,
                rgba(0, 0, 0, 0.08) 6px,
                rgba(0, 0, 0, 0.08) 12px
            );
        }

        /* Rating & Position */
        .card-top {
            position: absolute;
            top: 22px;
            left: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 10;
        }

        .card-rating {
            font-family: 'Oswald', sans-serif;
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            transition: all 0.3s ease;
        }

        .card-rating.animating {
            animation: statPulse 0.3s ease;
        }

        .card-position {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: -2px;
        }


        /* Player Avatar */
        .player-image-container {
            position: absolute;
            top: 28px;
            right: 28px;
            width: 140px;
            height: 140px;
            z-index: 5;
        }

        .player-placeholder {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: 46px;
            font-weight: 700;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 4px 15px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .player-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Player Name */
        .player-name-bar {
            position: absolute;
            top: 185px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            text-align: center;
            padding: 12px 0 10px;
            border-top: 2px solid;
            border-bottom: 1px solid;
            z-index: 10;
        }

        .player-name {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Stats Grid */
        .stats-container {
            position: absolute;
            top: 250px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 20px;
            z-index: 10;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .stat-row.left {
            justify-content: flex-start;
        }

        .stat-row.right {
            justify-content: flex-end;
            flex-direction: row-reverse;
        }

        .stat-value {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            font-weight: 700;
            min-width: 36px;
            transition: all 0.3s ease;
        }

        .stat-value.animating {
            animation: statPulse 0.3s ease;
        }

        .stat-value.stat-up {
            color: #4ade80 !important;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5) !important;
        }

        .stat-value.stat-down {
            color: #f87171 !important;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.5) !important;
        }

        @keyframes statPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Stat change indicator */
        .stat-change {
            position: absolute;
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
        }

        .stat-row.left .stat-change {
            left: 40px;
            top: -5px;
        }

        .stat-row.right .stat-change {
            right: 40px;
            top: -5px;
        }

        .stat-change.positive {
            color: #4ade80;
            animation: floatUp 1.5s ease-out forwards;
        }

        .stat-change.negative {
            color: #f87171;
            animation: floatUp 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(10px); }
            20% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        .stat-row.left .stat-value {
            text-align: left;
        }

        .stat-row.right .stat-value {
            text-align: right;
        }

        .stat-label {
            font-family: 'Oswald', sans-serif;
            font-size: 15px;
            font-weight: 500;
            opacity: 0.85;
        }

        /* Rank Footer */
        .card-footer {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .rank-badge {
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 5px 16px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Shine Effect - contained within card using background-position */
        .card-shine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: url(#cardClip);
            background: linear-gradient(
                105deg,
                transparent 0%,
                transparent 40%,
                rgba(255, 255, 255, 0.15) 45%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0.15) 55%,
                transparent 60%,
                transparent 100%
            );
            background-size: 200% 100%;
            background-position: 200% 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fifa-card:not(.no-hover):hover .card-shine {
            opacity: 1;
            animation: shine 0.6s ease forwards;
        }

        @keyframes shine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===================
           DUEL RESULT OVERLAY
           =================== */
        .duel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.5s ease;
        }

        .duel-overlay.active {
            opacity: 1;
            pointer-events: all;
            background: rgba(0, 0, 0, 0.9);
        }

        .duel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .duel-title {
            font-family: 'Oswald', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease;
        }

        .duel-overlay.active .duel-title {
            opacity: 1;
            transform: translateY(0);
        }

        .duel-result {
            font-family: 'Oswald', sans-serif;
            font-size: 72px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 8px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .duel-result.win { color: #4ade80; text-shadow: 0 0 40px rgba(74, 222, 128, 0.6); }
        .duel-result.loss { color: #f87171; text-shadow: 0 0 40px rgba(248, 113, 113, 0.6); }
        .duel-result.draw { color: #fbbf24; text-shadow: 0 0 40px rgba(251, 191, 36, 0.6); }

        .duel-overlay.active .duel-result {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.3s;
        }

        .duel-category {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            transition: all 0.5s ease;
        }

        .duel-overlay.active .duel-category {
            opacity: 1;
            transition-delay: 0.5s;
        }

        .duel-rating-change {
            font-family: 'Oswald', sans-serif;
            font-size: 36px;
            font-weight: 700;
            opacity: 0;
            transition: all 0.5s ease;
        }

        .duel-rating-change.positive { color: #4ade80; }
        .duel-rating-change.negative { color: #f87171; }

        .duel-overlay.active .duel-rating-change {
            opacity: 1;
            transition-delay: 0.7s;
        }

        /* ===================
           RANK UP ANIMATION SYSTEM
           =================== */

        /* Overlay for rank up */
        .rankup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.5s ease;
        }

        .rankup-overlay.active {
            opacity: 1;
            pointer-events: all;
            background: rgba(0, 0, 0, 0.85);
        }

        .rankup-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* Particle effects container */
        .particles-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            pointer-events: none;
            z-index: 5;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0;
        }

        /* Glow ring effect */
        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 500px;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
        }

        /* Rank up text */
        .rankup-text {
            font-family: 'Oswald', sans-serif;
            font-size: 48px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 8px;
            opacity: 0;
            transform: scale(0.5) translateY(50px);
            text-shadow: 0 0 30px currentColor;
            z-index: 20;
        }

        .rankup-tier-name {
            font-family: 'Oswald', sans-serif;
            font-size: 72px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 12px;
            opacity: 0;
            transform: scale(2);
            z-index: 20;
        }

        /* Card animation states */
        .rankup-card-container {
            position: relative;
            z-index: 10;
        }

        .rankup-card-container .fifa-card {
            transition: all 0.5s ease;
        }

        /* Lightning bolts */
        .lightning {
            position: absolute;
            width: 4px;
            height: 100px;
            background: linear-gradient(180deg, transparent, currentColor, transparent);
            opacity: 0;
            z-index: 6;
            filter: blur(1px);
        }

        /* Star burst */
        .star-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            border-radius: 50%;
            opacity: 0;
            z-index: 3;
        }

        /* Skip button */
        .skip-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .rankup-overlay.active .skip-btn {
            opacity: 1;
        }

        /* ===================
           TIER COLOR SCHEMES
           =================== */

        /* BRONZE - Matte/Dull */
        .fifa-card.bronze .card-rating,
        .fifa-card.bronze .card-position,
        .fifa-card.bronze .player-name,
        .fifa-card.bronze .stat-value,
        .fifa-card.bronze .stat-label {
            color: #3d2a1a;
        }

        .fifa-card.bronze .player-placeholder {
            background: linear-gradient(145deg, #9a7048 0%, #6b4423 100%);
            color: #3d2a1a;
            border: 3px solid #5c3d1e;
        }

        .fifa-card.bronze .player-name-bar {
            border-color: #6b4423;
        }

        .fifa-card.bronze .rank-badge {
            background: rgba(92, 61, 30, 0.4);
            color: #3d2a1a;
            border: 1px solid #6b4423;
        }

        .tier-label.bronze {
            background: linear-gradient(135deg, #9a7048 0%, #6b4423 100%);
            color: #2a1a10;
        }

        /* SILVER - Brushed Metal/Slightly Dull */
        .fifa-card.silver .card-rating,
        .fifa-card.silver .card-position,
        .fifa-card.silver .player-name,
        .fifa-card.silver .stat-value,
        .fifa-card.silver .stat-label {
            color: #3a3a3a;
        }

        .fifa-card.silver .player-placeholder {
            background: linear-gradient(145deg, #b8b8b8 0%, #808080 100%);
            color: #3a3a3a;
            border: 3px solid #686868;
        }

        .fifa-card.silver .player-name-bar {
            border-color: #808080;
        }

        .fifa-card.silver .rank-badge {
            background: rgba(100, 100, 100, 0.4);
            color: #3a3a3a;
            border: 1px solid #808080;
        }

        .tier-label.silver {
            background: linear-gradient(135deg, #b8b8b8 0%, #888888 100%);
            color: #2a2a2a;
        }

        /* GOLD - Shiny! */
        .fifa-card.gold .card-rating,
        .fifa-card.gold .card-position,
        .fifa-card.gold .player-name,
        .fifa-card.gold .stat-value,
        .fifa-card.gold .stat-label {
            color: #5a4010;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .fifa-card.gold .player-placeholder {
            background: linear-gradient(145deg, #ffe066 0%, #cc9900 50%, #ffd700 100%);
            color: #5a4010;
            border: 3px solid #b38600;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.3), 0 4px 15px rgba(204, 153, 0, 0.5);
        }

        .fifa-card.gold .player-name-bar {
            border-color: #cc9900;
        }

        .fifa-card.gold .rank-badge {
            background: rgba(179, 134, 0, 0.3);
            color: #5a4010;
            border: 1px solid #cc9900;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .tier-label.gold {
            background: linear-gradient(135deg, #ffe066 0%, #ffd700 50%, #cc9900 100%);
            color: #5a4010;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        /* PLATINUM - Shiny white-gold! */
        .fifa-card.platinum .card-rating,
        .fifa-card.platinum .card-position,
        .fifa-card.platinum .player-name,
        .fifa-card.platinum .stat-value,
        .fifa-card.platinum .stat-label {
            color: #1a3028;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .fifa-card.platinum .player-placeholder {
            background: linear-gradient(145deg, #ffffff 0%, #a8d8c0 50%, #e8f5f0 100%);
            color: #1a3028;
            border: 3px solid #60b890;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5), 0 4px 15px rgba(96, 184, 144, 0.4);
        }

        .fifa-card.platinum .player-name-bar {
            border-color: #80c8a8;
        }

        .fifa-card.platinum .rank-badge {
            background: rgba(96, 184, 144, 0.25);
            color: #1a3028;
            border: 1px solid #80c8a8;
            box-shadow: 0 0 10px rgba(168, 216, 192, 0.4);
        }

        .tier-label.platinum {
            background: linear-gradient(135deg, #a8e6cf 0%, #3d8b6e 100%);
            color: #1a2a3a;
        }

        /* DIAMOND - Super Shiny Crystalline! */
        .fifa-card.diamond .card-rating,
        .fifa-card.diamond .card-position,
        .fifa-card.diamond .player-name,
        .fifa-card.diamond .stat-value,
        .fifa-card.diamond .stat-label {
            color: #1a3040;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5), 0 0 10px rgba(160, 216, 255, 0.3);
        }

        .fifa-card.diamond .player-placeholder {
            background: linear-gradient(145deg, #ffffff 0%, #a0d8ff 30%, #ffffff 50%, #80c8f0 70%, #e8f6ff 100%);
            color: #1a3040;
            border: 3px solid #70c0f0;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.6), 0 4px 20px rgba(112, 192, 240, 0.5), 0 0 30px rgba(160, 216, 255, 0.3);
        }

        .fifa-card.diamond .player-name-bar {
            border-color: #80c8f0;
        }

        .fifa-card.diamond .rank-badge {
            background: rgba(112, 192, 240, 0.25);
            color: #1a3040;
            border: 1px solid #80c8f0;
            box-shadow: 0 0 15px rgba(160, 216, 255, 0.5);
        }

        .tier-label.diamond {
            background: linear-gradient(135deg, #ffffff 0%, #c0e8ff 30%, #ffffff 50%, #a0d8ff 70%, #70c0f0 100%);
            color: #1a3040;
            box-shadow: 0 0 20px rgba(160, 216, 255, 0.6);
        }

        /* Diamond shimmer animation - contained within card */
        .fifa-card.diamond::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                105deg,
                transparent 0%,
                transparent 40%,
                rgba(255, 255, 255, 0.5) 45%,
                rgba(255, 255, 255, 0.8) 50%,
                rgba(255, 255, 255, 0.5) 55%,
                transparent 60%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: diamondShimmer 3s ease-in-out infinite;
            clip-path: url(#cardClip);
            pointer-events: none;
        }

        @keyframes diamondShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* LEGEND - Fiery Ember Glow Shiny! */
        .fifa-card.legend .card-rating,
        .fifa-card.legend .card-position,
        .fifa-card.legend .player-name,
        .fifa-card.legend .stat-value,
        .fifa-card.legend .stat-label {
            color: #3a1510;
            text-shadow: 0 1px 0 rgba(255, 200, 150, 0.4), 0 0 10px rgba(255, 102, 0, 0.2);
        }

        .fifa-card.legend .player-placeholder {
            background: linear-gradient(145deg, #ffcc80 0%, #ff6600 30%, #ffaa44 50%, #ee4400 70%, #cc3300 100%);
            color: #3a1510;
            border: 3px solid #cc3300;
            box-shadow: inset 0 0 25px rgba(255, 200, 100, 0.4), 0 4px 20px rgba(255, 102, 0, 0.5), 0 0 30px rgba(255, 85, 0, 0.3);
        }

        .fifa-card.legend .player-name-bar {
            border-color: #ee4400;
        }

        .fifa-card.legend .rank-badge {
            background: rgba(204, 51, 0, 0.25);
            color: #3a1510;
            border: 1px solid #ee4400;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.4);
        }

        .tier-label.legend {
            background: linear-gradient(135deg, #ffcc80 0%, #ff6600 50%, #cc3300 100%);
            color: #3a1510;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
        }

        /* Legend fire animation */
        .fifa-card.legend::after {
            content: '';
            position: absolute;
            bottom: 0;

            left: 0;
            width: 100%;

            background: linear-gradient(

                transparent 0%,
                transparent 35%,
                rgba(200, 160, 255, 0.4) 42%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(200, 160, 255, 0.4) 58%,
                transparent 65%,

            clip-path: url(#cardClip);

</head>

    <script>
        // ===================
        // STATCARD MODULE
        // ===================
        const StatCard = (function() {
            // Tier Configuration
            const TIERS = [
                { id: 'bronze', name: 'BRONZE', min: 0, max: 999, gradient: 'bronzeGradient', color: '#8b6239', glow: 'rgba(139, 98, 57, 0.6)' },
                { id: 'silver', name: 'SILVER', min: 1000, max: 1399, gradient: 'silverGradient', color: '#a0a0a0', glow: 'rgba(160, 160, 160, 0.6)' },

                { id: 'platinum', name: 'PLATINUM', min: 1800, max: 2199, gradient: 'platinumGradient', color: '#80c8a8', glow: 'rgba(128, 200, 168, 0.9)' },

                { id: 'icon', name: 'ICON', min: 3000, max: Infinity, gradient: 'iconGradient', color: '#c8a0ff', glow: 'rgba(200, 160, 255, 1)' }
            ];

            // Hardcoded user data with profile images
            const USERS_DATA = [
                { 
                    userId: 'alex_chen', 
                    displayName: 'Alex Chen',
                    avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop&crop=face',

                    displayName: 'Sarah Kim',
                    avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&h=150&fit=crop&crop=face',
                    blendedRating: 1680, 
                    rank: 2, 
                    stats: { 
                        engineering: { rating: 1720 }, 
                        finance: { rating: 1750 }, 
                        creative: { rating: 1650 }, 
                        business_ops: { rating: 1680 }, 
                        product: { rating: 1600 }, 
                        research: { rating: 1700 } 
                    }
                },
                { 
                    userId: 'mike_johnson', 
                    displayName: 'Mike Johnson',
                    avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&h=150&fit=crop&crop=face',
                    blendedRating: 1620, 
                    rank: 3, 
                    stats: { 
                        engineering: { rating: 1580 }, 
                        finance: { rating: 1600 }, 
                        creative: { rating: 1700 }, 
                        business_ops: { rating: 1650 }, 
                        product: { rating: 1620 }, 
                        research: { rating: 1550 } 
                    }
                },
                { 
                    userId: 'emma_davis', 
                    displayName: 'Emma Davis',
                    avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150&h=150&fit=crop&crop=face',
                    blendedRating: 1550, 
                    rank: 4, 
                    stats: { 
                        engineering: { rating: 1500 }, 
                        finance: { rating: 1580 }, 
                        creative: { rating: 1620 }, 
                        business_ops: { rating: 1550 }, 
                        product: { rating: 1480 }, 
                        research: { rating: 1570 } 
                    }
                },
                { 
                    userId: 'james_wilson', 
                    displayName: 'James Wilson',
                    avatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150&h=150&fit=crop&crop=face',
                    blendedRating: 1480,

                },
                {

                    displayName: 'Lisa Wang',
                    avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150&h=150&fit=crop&crop=face',
                    blendedRating: 1420, 
                    rank: 6, 
                    stats: { 
                        engineering: { rating: 1400 }, 
                        finance: { rating: 1450 }, 
                        creative: { rating: 1480 }, 
                        business_ops: { rating: 1420 },

                    }
                },
                {

                    blendedRating: 1350,

                        business_ops: { rating: 1340 }, 
                        product: { rating: 1360 }, 
                        research: { rating: 1300 } 
                    }
                }
            ];

            // State
            let allUsers = [...USERS_DATA];
            let selectedUserId = null;
            let animationInProgress = false;
            let animationTimers = [];

            // Utility Functions
            function getTier(rating) {
                for (const tier of TIERS) {
                    if (rating >= tier.min && rating <= tier.max) return tier;
                }
                return TIERS[0];
            }

            function getTierById(id) {
                return TIERS.find(t => t.id === id) || TIERS[0];
            }

            function getInitials(name) {
                if (!name) return '??';
                const parts = name.split(/[\s._-]+/);
                return parts.length >= 2 
                    ? (parts[0][0] + parts[1][0]).toUpperCase()
                    : name.substring(0, 2).toUpperCase();
            }

            function ratingToOvr(rating) {
                return Math.min(99, Math.max(40, Math.round(40 + (rating - 500) * (59 / 2500))));
            }

            function statToDisplay(rating) {
                return Math.min(99, Math.max(40, Math.round(40 + (rating - 500) * (59 / 2500))));
            }

            function getBestArchetype(stats) {
                const labels = {
                    engineering: 'DEV',
                    finance: 'FIN',
                    creative: 'CRE',
                    business_ops: 'BUS',
                    product: 'PRD',
                    research: 'RES'
                };
                
                let best = 'engineering';
                let bestRating = 0;
                
                for (const [arch, stat] of Object.entries(stats)) {
                    if (stat.rating > bestRating) {
                        bestRating = stat.rating;
                        best = arch;
                    }
                }
                
                return labels[best] || 'DEV';
            }

            function createCardHTML(data, tier) {
                const avatarContent = data.avatar 
                    ? `<img src="${data.avatar}" alt="${data.displayName || data.userId}" onerror="this.parentElement.innerHTML='${getInitials(data.displayName || data.userId)}'">`
                    : getInitials(data.displayName || data.userId);

                return `
                    <div class="card-wrapper">
                        <div class="fifa-card ${tier.id}" data-user="${data.userId}">

                                     L 282 0 
                                     Q 300 0 300 18 
                                     L 300 365 
                                     Q 300 380 290 390 
                                     L 160 428 
                                     Q 150 432 140 428 
                                     L 10 390 
                                     Q 0 380 0 365 
                                     L 0 18 
                                     Q 0 0 18 0 Z"/>
                            </svg>
                            
                            <div class="card-pattern"></div>
                            
                            <div class="card-top">
                                <div class="card-rating" data-stat="overall">${ratingToOvr(data.blendedRating)}</div>
                                <div class="card-position">${getBestArchetype(data.stats)}</div>
                            </div>
                            
                            <div class="player-image-container">
                                <div class="player-placeholder">${avatarContent}</div>
                            </div>
                            
                            <div class="player-name-bar">
                                <div class="player-name">${(data.displayName || data.userId).toUpperCase()}</div>
                            </div>
                            
                            <div class="stats-container">
                                <div class="stat-row left" data-stat-key="engineering">

            // ===================
            // STAT ANIMATION
            // ===================
            function animateStatChange(statElement, oldValue, newValue, duration = 800) {
                return new Promise(resolve => {
                    const startTime = performance.now();
                    const diff = newValue - oldValue;
                    
                    // Add direction class
                    if (diff > 0) {
                        statElement.classList.add('stat-up');
                    } else if (diff < 0) {
                        statElement.classList.add('stat-down');
                    }
                    
                    statElement.classList.add('animating');
                    
                    function update(currentTime) {
                        const elapsed = currentTime - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        
                        // Easing function
                        const easeOut = 1 - Math.pow(1 - progress, 3);
                        const currentValue = Math.round(oldValue + diff * easeOut);
                        
                        statElement.textContent = currentValue;
                        
                        if (progress < 1) {
                            requestAnimationFrame(update);
                        } else {
                            statElement.textContent = newValue;
                            statElement.classList.remove('animating');
                            
                            // Keep color for a moment then fade
                            setTimeout(() => {
                                statElement.classList.remove('stat-up', 'stat-down');
                            }, 1500);
                            
                            resolve();
                        }
                    }
                    
                    requestAnimationFrame(update);
                });
            }

            function showStatChangeIndicator(statRow, change) {
                const indicator = statRow.querySelector('.stat-change');
                if (!indicator) return;
                
                indicator.textContent = change > 0 ? `+${change}` : `${change}`;
                indicator.className = 'stat-change ' + (change > 0 ? 'positive' : 'negative');
                
                // Reset animation
                indicator.style.animation = 'none';
                indicator.offsetHeight; // Trigger reflow
                indicator.style.animation = '';
            }

            // ===================
            // FULL WORKFLOW DEMO
            // ===================
            async function demoFullWorkflow() {
                if (animationInProgress) return;
                animationInProgress = true;

                // Setup: Create a user right at the edge of Gold → Platinum threshold
                // Gold max is 1799, Platinum starts at 1800
                const demoUser = {
                    userId: 'demo_player',
                    displayName: 'Demo Player',
                    avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop&crop=face',
                    blendedRating: 1780, // Just below Platinum (1800)
                    rank: 1,
                    stats: {
                        engineering: { rating: 1790 },
                        finance: { rating: 1770 },
                        creative: { rating: 1785 },
                        business_ops: { rating: 1775 },
                        product: { rating: 1780 },
                        research: { rating: 1780 }
                    }
                };

                // Display the demo user's card first
                selectedUserId = demoUser.userId;
                const oldTier = getTier(demoUser.blendedRating);
                const container = document.getElementById('card-container');
                container.innerHTML = createCardHTML(demoUser, oldTier);

                await new Promise(r => setTimeout(r, 500));

                // Store old values for animation
                const oldBlendedRating = demoUser.blendedRating;
                const oldEngRating = demoUser.stats.engineering.rating;

                // The duel win - guaranteed positive change
                const ratingGain = 32; // Enough to push into Platinum
                const newEngRating = oldEngRating + ratingGain;
                demoUser.stats.engineering.rating = newEngRating;

                // Recalculate blended rating
                let totalRating = 0;
                for (const stat of Object.values(demoUser.stats)) {
                    totalRating += stat.rating;
                }
                demoUser.blendedRating = Math.round(totalRating / 6); // Will be ~1785 + 5 = ~1785

                // Actually, let's make sure it crosses threshold
                // Set it explicitly to cross into Platinum
                demoUser.blendedRating = 1810;

                // PHASE 1: Show Duel Result Overlay
                const overlay = document.getElementById('duel-overlay');
                const resultEl = document.getElementById('duel-result');
                const categoryEl = document.getElementById('duel-category');
                const changeEl = document.getElementById('duel-rating-change');
                
                resultEl.textContent = 'VICTORY!';
                resultEl.className = 'duel-result win';
                categoryEl.textContent = 'Engineering Challenge';
                changeEl.textContent = `+${ratingGain} Rating`;
                changeEl.className = 'duel-rating-change positive';
                
                overlay.classList.add('active');
                
                await new Promise(r => setTimeout(r, 2000));
                overlay.classList.remove('active');
                
                await new Promise(r => setTimeout(r, 600));

                // PHASE 2: Animate Engineering stat going UP
                const card = document.querySelector('.fifa-card');
                if (card) {
                    const statRow = card.querySelector('[data-stat-key="engineering"]');
                    const statValue = statRow?.querySelector('.stat-value');
                    
                    if (statValue) {
                        const oldDisplay = statToDisplay(oldEngRating);
                        const newDisplay = statToDisplay(newEngRating);
                        const displayChange = newDisplay - oldDisplay;
                        
                        showStatChangeIndicator(statRow, displayChange);
                        await animateStatChange(statValue, oldDisplay, newDisplay, 1000);
                    }

                    await new Promise(r => setTimeout(r, 400));

                    // PHASE 3: Animate Overall rating going UP
                    const overallEl = card.querySelector('[data-stat="overall"]');
                    if (overallEl) {
                        const oldOvr = ratingToOvr(oldBlendedRating);
                        const newOvr = ratingToOvr(demoUser.blendedRating);
                        
                        // Add green glow to overall
                        overallEl.classList.add('stat-up');
                        await animateStatChange(overallEl, oldOvr, newOvr, 800);
                    }
                }

                await new Promise(r => setTimeout(r, 800));

                // PHASE 4: Rank Up Animation (Gold → Platinum)
                const newTier = getTier(demoUser.blendedRating);
                await playRankUpAnimationInternal(demoUser, 'gold', 'platinum');

                // Final: Show the new Platinum card
                const finalTier = getTier(demoUser.blendedRating);
                container.innerHTML = createCardHTML(demoUser, finalTier);
                
                animationInProgress = false;
            }

            // Internal rank up that doesn't check animationInProgress
            function playRankUpAnimationInternal(userData, oldTier, newTier) {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('rankup-overlay');

                    const newTierData = getTierById(newTier);

                    overlay.classList.add('active');

                    const timeline = [
                        { time: 100, fn: () => {

                        }},
                        { time: 500, fn: () => createParticles(particlesContainer, oldTierData.color, 30) },
                        { time: 800, fn: () => {
                            glowRing.style.transition = 'opacity 0.5s ease';
                            glowRing.style.opacity = '0.5';
                        }},
                        { time: 1200, fn: () => {
                            card.style.animation = 'none';
                            card.style.transition = 'transform 0.8s ease, filter 0.3s ease';
                            card.style.transform = 'rotateY(90deg) scale(0.8)';
                            card.style.filter = 'brightness(2)';
                        }},
                        { time: 1600, fn: () => {
                            cardContainer.innerHTML = createCardHTML(userData, newTierData);
                            const newCard = cardContainer.querySelector('.fifa-card');
                            newCard.classList.add('no-hover');
                            newCard.style.transform = 'rotateY(-90deg) scale(0.8)';
                            newCard.style.filter = 'brightness(2)';
                            newCard.style.transition = 'transform 0.8s ease, filter 0.5s ease';
                            
                            starBurst.style.transition = 'all 0.5s ease';
                            starBurst.style.width = '800px';
                            starBurst.style.height = '800px';
                            starBurst.style.opacity = '0.8';
                        }},
                        { time: 1700, fn: () => {
                            const newCard = cardContainer.querySelector('.fifa-card');
                            newCard.style.transform = 'rotateY(0deg) scale(1)';
                            newCard.style.filter = 'brightness(1.5)';
                            createParticles(particlesContainer, newTierData.color, 50);
                        }},
                        { time: 2000, fn: () => {
                            rankupText.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                            rankupText.style.opacity = '1';
                            rankupText.style.transform = 'scale(1) translateY(0)';
                            
                            const newCard = cardContainer.querySelector('.fifa-card');
                            newCard.style.filter = 'brightness(1)';
                        }},
                        { time: 2500, fn: () => {
                            tierName.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                            tierName.style.opacity = '1';
                            tierName.style.transform = 'scale(1)';
                            glowRing.style.animation = 'glowPulse 1s ease infinite';
                        }},
                        { time: 3000, fn: () => {
                            starBurst.style.opacity = '0';
                            starBurst.style.width = '1000px';
                            starBurst.style.height = '1000px';
                        }},
                        { time: 4500, fn: () => {
                            rankupText.style.opacity = '0';
                            tierName.style.opacity = '0';
                            glowRing.style.opacity = '0';
                        }},
                        { time: 5000, fn: () => {
                            finishAnimation(resolve, newTierData);
                        }}
                    ];

                    timeline.forEach(({ time, fn }) => {
                        animationTimers.push(setTimeout(fn, time));
                    });
                });
            }

            // ===================
            // RANK UP ANIMATION
            // ===================
            function playRankUpAnimation(userData, oldTier, newTier) {
                if (animationInProgress && !arguments[3]) return Promise.resolve();
                animationInProgress = true;

                return new Promise((resolve) => {
                    const overlay = document.getElementById('rankup-overlay');
                    const cardContainer = document.getElementById('rankup-card-container');
                    const particlesContainer = document.getElementById('particles-container');
                    const glowRing = document.getElementById('glow-ring');
                    const starBurst = document.getElementById('star-burst');
                    const rankupText = document.getElementById('rankup-text');
                    const tierName = document.getElementById('rankup-tier-name');

                    // Clear previous
                    particlesContainer.innerHTML = '';
                    animationTimers.forEach(t => clearTimeout(t));
                    animationTimers = [];

                    // Set initial card (old tier)
                    const oldTierData = getTierById(oldTier);
                    const newTierData = getTierById(newTier);
                    
                    cardContainer.innerHTML = createCardHTML(userData, oldTierData);
                    const card = cardContainer.querySelector('.fifa-card');
                    card.classList.add('no-hover');

                    // Setup colors
                    rankupText.style.color = newTierData.color;
                    tierName.style.color = newTierData.color;
                    tierName.textContent = newTierData.name;
                    glowRing.style.boxShadow = `0 0 100px 50px ${newTierData.glow}, inset 0 0 100px 50px ${newTierData.glow}`;
                    starBurst.style.background = `radial-gradient(circle, ${newTierData.glow} 0%, transparent 70%)`;

                    // Show overlay
                    overlay.classList.add('active');

                    // Animation Timeline
                    const timeline = [
                        { time: 100, fn: () => {
                            card.style.animation = 'cardShake 0.1s ease infinite';
                            card.style.filter = 'brightness(1.2)';
                        }},
                        { time: 500, fn: () => createParticles(particlesContainer, oldTierData.color, 30) },
                        { time: 800, fn: () => {
                            glowRing.style.transition = 'opacity 0.5s ease';
                            glowRing.style.opacity = '0.5';
                        }},
                        { time: 1200, fn: () => {
                            card.style.animation = 'none';
                            card.style.transition = 'transform 0.8s ease, filter 0.3s ease';
                            card.style.transform = 'rotateY(90deg) scale(0.8)';
                            card.style.filter = 'brightness(2)';
                        }},
                        { time: 1600, fn: () => {
                            const newUserData = { ...userData, blendedRating: newTierData.min + 50 };
                            cardContainer.innerHTML = createCardHTML(newUserData, newTierData);
                            const newCard = cardContainer.querySelector('.fifa-card');
                            newCard.classList.add('no-hover');
                            newCard.style.transform = 'rotateY(-90deg) scale(0.8)';
                            newCard.style.filter = 'brightness(2)';
                            newCard.style.transition = 'transform 0.8s ease, filter 0.5s ease';
                            
                            starBurst.style.transition = 'all 0.5s ease';
                            starBurst.style.width = '800px';
                            starBurst.style.height = '800px';
                            starBurst.style.opacity = '0.8';
                        }},
                        { time: 1700, fn: () => {
                            const newCard = cardContainer.querySelector('.fifa-card');
                            newCard.style.transform = 'rotateY(0deg) scale(1)';
                            newCard.style.filter = 'brightness(1.5)';
                            createParticles(particlesContainer, newTierData.color, 50);
                        }},
                        { time: 2000, fn: () => {
                            rankupText.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                            rankupText.style.opacity = '1';
                            rankupText.style.transform = 'scale(1) translateY(0)';
                            
                            const newCard = cardContainer.querySelector('.fifa-card');
                            newCard.style.filter = 'brightness(1)';
                        }},
                        { time: 2500, fn: () => {
                            tierName.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                            tierName.style.opacity = '1';
                            tierName.style.transform = 'scale(1)';
                            glowRing.style.animation = 'glowPulse 1s ease infinite';
                        }},
                        { time: 3000, fn: () => {
                            starBurst.style.opacity = '0';
                            starBurst.style.width = '1000px';
                            starBurst.style.height = '1000px';
                        }},
                        { time: 4500, fn: () => {
                            rankupText.style.opacity = '0';
                            tierName.style.opacity = '0';
                            glowRing.style.opacity = '0';
                        }},
                        { time: 5000, fn: () => {
                            finishAnimation(resolve, newTierData);
                        }}
                    ];

                    timeline.forEach(({ time, fn }) => {
                        animationTimers.push(setTimeout(fn, time));
                    });
                });
            }

            function createParticles(container, color, count) {
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.background = color;
                    particle.style.left = '50%';
                    particle.style.top = '50%';
                    
                    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                    const distance = 150 + Math.random() * 200;
                    const duration = 1 + Math.random() * 1;
                    const size = 4 + Math.random() * 8;
                    
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    
                    particle.animate([
                        { 
                            opacity: 1, 
                            transform: 'translate(-50%, -50%) scale(1)',
                            boxShadow: `0 0 ${size * 2}px ${color}`
                        },
                        { 
                            opacity: 0, 
                            transform: `translate(calc(-50% + ${Math.cos(angle) * distance}px), calc(-50% + ${Math.sin(angle) * distance}px)) scale(0)`,
                            boxShadow: `0 0 0px ${color}`
                        }
                    ], {
                        duration: duration * 1000,
                        easing: 'cubic-bezier(0, 0.5, 0.5, 1)',
                        fill: 'forwards'
                    });
                    
                    container.appendChild(particle);
                    setTimeout(() => particle.remove(), duration * 1000);
                }
            }

            function finishAnimation(resolve, newTierData) {
                const overlay = document.getElementById('rankup-overlay');
                overlay.classList.remove('active');
                
                setTimeout(() => {
                    document.getElementById('rankup-text').style.cssText = '';
                    document.getElementById('rankup-tier-name').style.cssText = '';
                    document.getElementById('glow-ring').style.cssText = '';
                    document.getElementById('star-burst').style.cssText = '';
                    document.getElementById('rankup-card-container').innerHTML = '';
                    document.getElementById('particles-container').innerHTML = '';
                    
                    animationInProgress = false;
                    resolve(newTierData);
                }, 500);
            }

            function skipAnimation() {
                animationTimers.forEach(t => clearTimeout(t));
                animationTimers = [];
                
                const overlay = document.getElementById('rankup-overlay');
                overlay.classList.remove('active');
                
                setTimeout(() => {
                    document.getElementById('rankup-text').style.cssText = '';
                    document.getElementById('rankup-tier-name').style.cssText = '';
                    document.getElementById('glow-ring').style.cssText = '';
                    document.getElementById('star-burst').style.cssText = '';
                    document.getElementById('rankup-card-container').innerHTML = '';
                    document.getElementById('particles-container').innerHTML = '';
                    
                    animationInProgress = false;
                }, 300);
            }

            // Add CSS animation for card shake
            const style = document.createElement('style');
            style.textContent = `
                @keyframes cardShake {
                    0%, 100% { transform: translateX(0) rotate(0); }
                    25% { transform: translateX(-5px) rotate(-1deg); }
                    75% { transform: translateX(5px) rotate(1deg); }
                }
                @keyframes glowPulse {
                    0%, 100% { opacity: 0.5; }
                    50% { opacity: 0.8; }
                }
            `;
            document.head.appendChild(style);

            // ===================
            // PUBLIC API
            // ===================
            function displayCard(userId) {
                const user = allUsers.find(u => u.userId === userId);
                if (!user) return;

                selectedUserId = userId;
                const tier = getTier(user.blendedRating);
                const container = document.getElementById('card-container');
                container.innerHTML = createCardHTML(user, tier);

                document.querySelectorAll('.leaderboard-row').forEach(row => {
                    row.classList.remove('active');
                    if (row.dataset.userId === userId) {
                        row.classList.add('active');
                    }
                });
            }

            function renderLeaderboard(entries) {
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = '';

                entries.forEach((entry, index) => {
                    const tier = getTier(entry.blendedRating);
                    const row = document.createElement('div');
                    row.className = 'leaderboard-row';
                    row.dataset.userId = entry.userId;
                    
                    if (index === 0) row.classList.add('gold-row');
                    if (index === 1) row.classList.add('silver-row');
                    if (index === 2) row.classList.add('bronze-row');
                    if (entry.userId === selectedUserId) row.classList.add('active');

                    const avatarContent = entry.avatar 
                        ? `<img src="${entry.avatar}" alt="${entry.displayName || entry.userId}" onerror="this.parentElement.innerHTML='${getInitials(entry.displayName || entry.userId)}'">`
                        : getInitials(entry.displayName || entry.userId);

                    row.innerHTML = `
                        <span class="lb-rank">${index + 1}</span>
                        <div class="lb-avatar ${tier.id}">${avatarContent}</div>
                        <div class="lb-info">
                            <div class="lb-name">${entry.displayName || entry.userId}</div>
                            <div class="lb-tier">${tier.name}</div>
                        </div>
                        <span class="lb-rating">${ratingToOvr(entry.blendedRating)}</span>
                    `;

                    row.addEventListener('click', () => displayCard(entry.userId));
                    list.appendChild(row);
                });
            }

            // Demo functions exposed to window
            function onRatingUpdate(userData, oldRating, newRating) {
                const oldTier = getTier(oldRating);
                const newTier = getTier(newRating);

                if (newTier.id !== oldTier.id && TIERS.indexOf(newTier) > TIERS.indexOf(oldTier)) {
                    return playRankUpAnimation(userData, oldTier.id, newTier.id);
                }

                return Promise.resolve();
            }

            // Initialize
            function init() {
                allUsers = [...USERS_DATA];
                allUsers.sort((a, b) => b.blendedRating - a.blendedRating);
                allUsers.forEach((u, i) => u.rank = i + 1);

                renderLeaderboard(allUsers);
                
                // Auto-run the full workflow demo on page load
                setTimeout(() => {
                    demoFullWorkflow();
                }, 800);
            }

            // Return public API
            return {
                init,
                displayCard,
                renderLeaderboard,
                demoFullWorkflow,
                onRatingUpdate,
                skipAnimation,
                playRankUpAnimation,
                getTier,
                TIERS
            };
        })();

        // Initialize on load
        document.addEventListener('DOMContentLoaded', StatCard.init);
    </script>
