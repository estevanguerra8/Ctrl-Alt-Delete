<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series Duel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="duel-container">
    <header>
      <h1 id="challenge-title">Loading challenge...</h1>
      <p id="challenge-meta"></p>
      <p id="timer"></p>
    </header>

    <section>
      <pre id="challenge-prompt" class="challenge-prompt"></pre>
    </section>

    <section class="answer-section">
      <label for="answer">Your answer</label>
      <textarea id="answer" rows="10"></textarea>
      <button id="submitBtn">Submit</button>
    </section>

    <section id="result" class="result-section"></section>

    <script src="/script.js"></script>
  </main>
</body>
</html>
