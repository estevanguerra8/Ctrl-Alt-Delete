<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duel Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Duel Challenge</h1>
        </header>
        <main>
            <div id="duel-info" class="duel-info">
                <p>Loading duel...</p>
            </div>
            <div id="challenge-section" class="challenge-section" style="display: none;">
                <h2 id="challenge-title">Challenge</h2>
                <div id="challenge-prompt"></div>
                <div class="submission-section">
                    <h3>Your Submission</h3>
                    <textarea id="answer" placeholder="Enter your answer here..."></textarea>
                    <button id="submitBtn">Submit</button>
                </div>
                <div id="result" class="result" style="display: none;"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
