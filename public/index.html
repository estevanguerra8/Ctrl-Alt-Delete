<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series StatCard</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Spline 3D Background - Full Screen */
        .spline-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .spline-background iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        /* Content Overlay */
        .content-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            padding-top: 25vh;
        }

        /* Start Button - Smaller */
        .start-btn {
            pointer-events: auto;
            position: relative;
            z-index: 100;
            padding: 14px 50px;
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #0a0a0f;
            background: linear-gradient(145deg, #ffffff, #e0e0e0);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 
                0 8px 30px rgba(255, 255, 255, 0.3),
                0 0 40px rgba(255, 255, 255, 0.2),
                inset 0 2px 0 rgba(255, 255, 255, 0.8);
            animation: buttonPulse 2.5s ease-in-out infinite;
            text-decoration: none;
            display: inline-block;
        }

        @keyframes buttonPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 
                    0 8px 30px rgba(255, 255, 255, 0.3),
                    0 0 40px rgba(255, 255, 255, 0.2),
                    inset 0 2px 0 rgba(255, 255, 255, 0.8);
            }
            50% { 
                transform: scale(1.03);
                box-shadow: 
                    0 10px 40px rgba(255, 255, 255, 0.5),
                    0 0 60px rgba(255, 255, 255, 0.4),
                    inset 0 2px 0 rgba(255, 255, 255, 0.8);
            }
        }

        .start-btn:hover {
            transform: scale(1.08) !important;
            box-shadow: 
                0 15px 50px rgba(255, 255, 255, 0.6),
                0 0 80px rgba(255, 255, 255, 0.5),
                inset 0 2px 0 rgba(255, 255, 255, 0.9);
            animation: none;
        }

        .start-btn:active {
            transform: scale(0.98) !important;
        }

        /* Loading animation for Spline */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .start-btn {
                padding: 12px 40px;
                font-size: 16px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <!-- Spline 3D Background -->
    <div class="spline-background">
        <iframe 
            src="https://my.spline.design/glasswave-W46EV0MBrFSVgDOchLabgw1W/" 
            frameborder="0" 
            loading="eager"
            onload="hideLoading()"
        ></iframe>
    </div>

    <!-- Content Overlay - Only START button, centered lower -->
    <div class="content-overlay">
        <button class="start-btn" onclick="goToDuel()">Start</button>
    </div>

    <script>
        function hideLoading() {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        }

        // Fallback in case onload doesn't fire
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 4000);

        // Navigate to duel page
        function goToDuel() {
            window.location.href = '/duel';
        }
    </script>
</body>
</html>
